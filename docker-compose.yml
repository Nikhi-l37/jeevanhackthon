version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: talent-acquisition-app
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=${DATABASE_URL}
      - DIRECT_URL=${DIRECT_URL}
    env_file:
      - backend/.env
